<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TradingView Bridge</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f3f4f6;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 7px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .val {
      font-weight: 600;
      text-align: right;
    }
    .ok { color: #10b981; }
    .warn { color: #f59e0b; }
    .err { color: #ef4444; }
    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h2>🚀 Antigravity TV Bridge</h2>
  
  <div class="status-card">
    <div class="row">
      <span>Backend:</span>
      <span id="backend-status" class="val">Checking...</span>
    </div>
    <div class="row">
      <span>TradingView Tab:</span>
      <span id="tv-tab-status" class="val">No</span>
    </div>
    <div class="row">
      <span>Account State:</span>
      <span id="account-state-status" class="val">UNKNOWN</span>
    </div>
    <div class="row">
      <span>Active Broker:</span>
      <span id="broker-status" class="val">-</span>
    </div>
    <div class="row">
      <span>Paper Trading:</span>
      <span id="pt-status" class="val">Disconnected</span>
    </div>
    <div class="row">
      <span>Account Balance:</span>
      <span id="balance-status" class="val">-</span>
    </div>
    <div class="row">
      <span>Active Symbol:</span>
      <span id="symbol-status" class="val">-</span>
    </div>
    <div class="row">
      <span>Last Verified:</span>
      <span id="last-verified-status" class="val" style="font-size:11px;">Never</span>
    </div>
    <div id="error-message-box" style="display:none; margin-top:8px; padding:6px; background:rgba(239,68,68,0.2); border:1px solid #ef4444; border-radius:4px; font-size:11px; color:#fca5a5;"></div>
  </div>

  <button id="open-dashboard-btn" class="btn">Open Trading Bot Dashboard</button>

  <script src="popup.js"></script>
</body>
</html>
